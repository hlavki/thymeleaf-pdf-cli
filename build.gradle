plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.11'
    id 'java'
}

group = 'com.xitee.aok'
version = '1.1.0-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/milestone' }
}

ext {
    set('springShellVersion', "4.0.3")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.shell:spring-shell-starter'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.springframework:spring-web' // for aot compiler

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.shell:spring-shell-test'
    testImplementation 'org.springframework.shell:spring-shell-test-autoconfigure'
}


dependencyManagement {
    imports {
        mavenBom "org.springframework.shell:spring-shell-dependencies:${springShellVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

graalvmNative {
    binaries {
        main {
            buildArgs.addAll(
                    // Spring Framework 7 replaced spring-jcl with real commons-logging, whose
                    // LogFactory.factories static field is a WeakHashtable reached via PDFBox
                    // and stored in the image heap, so the whole package needs build-time init.
                    '--initialize-at-build-time=org.apache.commons.logging',
                    '--initialize-at-build-time=org.apache.commons.logging.impl',
                    '-H:+AddAllCharsets'
            )
        }
    }
}